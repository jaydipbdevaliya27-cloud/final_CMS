<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#187D6C" />
      <stop offset="100%" stop-color="#0E4F44" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" filter="url(#shadow)" />
  <rect x="32" y="32" width="448" height="448" rx="92" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="4" />

  <!-- Medical Cross -->
  <g fill="#FFFFFF">
    <rect x="216" y="116" width="80" height="280" rx="20" />
    <rect x="116" y="216" width="280" height="80" rx="20" />
  </g>

  <!-- Stethoscope Ring Overlay Accent -->
  <circle cx="256" cy="256" r="32" fill="#146B5C" stroke="#FFFFFF" stroke-width="8" />
  <circle cx="256" cy="256" r="14" fill="#FFFFFF" />
</svg>
